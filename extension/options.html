<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WA Web PIN Lock settings</title>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b141a; color: #e9edef; margin: 0; }
    main { max-width: 420px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 22px; }
    fieldset { border: 1px solid #2a3942; border-radius: 10px; padding: 16px; margin: 0 0 20px; }
    legend { padding: 0 6px; color: #8696a0; }
    label { display: block; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #2a3942; background: #202c33; color: #e9edef; font-size: 16px; }
    button { margin-top: 14px; padding: 10px 16px; border: 0; border-radius: 8px; background: #00a884; color: #111b21; font-weight: 600; cursor: pointer; }
    .status { min-height: 1.5em; margin-top: 10px; }
    .ok { color: #00a884; } .err { color: #f15c6d; }
    small { color: #8696a0; }
    .check { display: flex; gap: 8px; align-items: center; }
    .check input { width: auto; }
  </style>
</head>
<body>
  <main>
    <h1>WA Web PIN Lock</h1>

    <form id="pin-form" autocomplete="off">
      <fieldset>
        <legend>PIN</legend>
        <div id="current-wrap">
          <label for="current">Current PIN</label>
          <input id="current" type="password" inputmode="numeric" maxlength="12" />
        </div>
        <label for="new-pin">New PIN <small>(4–12 digits)</small></label>
        <input id="new-pin" type="password" inputmode="numeric" maxlength="12" required />
        <label for="confirm">Confirm new PIN</label>
        <input id="confirm" type="password" inputmode="numeric" maxlength="12" required />
        <button type="submit">Save PIN</button>
        <p class="status" id="pin-status" role="status"></p>
      </fieldset>
    </form>

    <form id="idle-form">
      <fieldset>
        <legend>Lock options</legend>
        <label class="check"><input id="show-button" type="checkbox" /> Show floating lock button on WhatsApp Web</label>
        <label for="idle">Auto-lock after this many idle minutes <small>(0 = off, default)</small></label>
        <input id="idle" type="number" min="0" max="1440" step="1" required />
        <button type="submit">Save</button>
        <p class="status" id="idle-status" role="status"></p>
      </fieldset>
    </form>

    <p><small>WhatsApp Web locks when it opens. Lock it any time with the floating button, the toolbar icon, or <b>Alt+Shift+L</b>
      (change the shortcut at <code>edge://extensions/shortcuts</code>). Drag the floating button to move it.</small></p>
  </main>
  <script src="pin.js"></script>
  <script src="options.js"></script>
</body>
</html>
